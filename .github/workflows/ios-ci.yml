name: iOS 빌드 검사

on: pull_request

permissions:
  contents: read

jobs:
  ios-build:
    name: iOS 시뮬레이터 빌드
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      ORG_GRADLE_PROJECT_bookSearchCi: 'true'
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: JDK 17 및 Gradle 캐시 설정
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Xcode 및 CI 설정 확인
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          test ! -e local.properties
          test ! -e iosApp/Configuration/Secrets.xcconfig
          echo "로컬 키 설정 파일 없이 빌드를 시작합니다."

      - name: iOS 시뮬레이터 앱 빌드
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/booksearch-derived-data" \
            -onlyUsePackageVersionsFromResolvedFile \
            -hideShellScriptEnvironment \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO KAKAO_REST_API_KEY=ci-build-only build

      - name: 앱 실행 파일과 빌드용 값 확인
        run: |
          app="$RUNNER_TEMP/booksearch-derived-data/Build/Products/Debug-iphonesimulator/BookSearch.app"
          test -x "$app/BookSearch"
          /usr/bin/file "$app/BookSearch"
          value=$(/usr/bin/plutil -extract KAKAO_REST_API_KEY raw -o - "$app/Info.plist")
          test "$value" = ci-build-only
          echo "Info.plist의 카카오 설정에 빌드용 값이 들어갔습니다."
